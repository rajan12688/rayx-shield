[package]
name = "rayx-shield-engine"
version = "0.3.0"
edition = "2021"
description = "RayX Shield Cybersecurity Detection Engine"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"]
 }
 dotenvy = "0.15"
 tiny_http = "0.12"
 zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"